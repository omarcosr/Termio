name: ci

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat the cache on CI; every build there starts clean.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  # Debug profile: clippy and every Rust test, in parallel with the release job below.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Release profile: the core library, the typecheck, Bun tests, the performance gates
  # (emulator throughput, flood bandwidth through the agent, zero frames while idle),
  # then the txiki.js executable and its installer.
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p termio-core
      - run: bun run typecheck
      - run: bun test
      - run: bun run check:perf
        env:
          SPIKE_RENDERER: cpu
      # `tarve build --runtime txiki` needs tjs.exe (TARVE_TXIKI).
      - uses: actions/cache@v4
        id: txiki
        with:
          path: ${{ runner.temp }}/txiki
          key: txiki-v26.6.0-windows-x86_64
      - name: Download txiki.js
        if: steps.txiki.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://github.com/saghul/txiki.js/releases/download/v26.6.0/txiki-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP\txiki.zip"
          Expand-Archive "$env:RUNNER_TEMP\txiki.zip" -DestinationPath "$env:RUNNER_TEMP\txiki"
      - name: Use txiki.js
        shell: pwsh
        run: |
          $tjs = "$env:RUNNER_TEMP\txiki\txiki-windows-x86_64\tjs.exe"
          & $tjs --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TARVE_TXIKI=$tjs" >> $env:GITHUB_ENV
      # The core is already built above: only the executable is left.
      - run: bun x tarve build app/desktop.tsx --runtime txiki --outfile dist/Termio.exe
      # The standard Tarve installer (wizard, shortcuts, Apps & features, Uninstall.exe).
      - run: bun x tarve package dist/Termio.exe --format setup --entry app/desktop.tsx --out dist/setup
      - uses: actions/upload-artifact@v4
        with:
          name: termio-windows-x64
          path: |
            dist/Termio.exe
            dist/setup/*.exe

  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # The agent runs on the servers: a static binary that needs nothing installed there.
      - run: cargo test -p termio-agent -p termio-proto
      - run: cargo build --release -p termio-agent --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: termio-agent-linux-x64
          path: target/x86_64-unknown-linux-musl/release/termio-agent
