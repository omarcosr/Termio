[package]
name = "termio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
termio-render = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termio-vt = { version = "0.1.0", path = "../termio-vt" }
termio-transport = { version = "0.1.0", path = "../termio-transport" }
termio-vault = { version = "0.1.0", path = "../termio-vault" }
termio-sync = { version = "0.1.0", path = "../termio-sync" }
ring = "0.17"
snap = "1"
tokio = { version = "1.54.1", features = ["sync"] }
xsalsa20poly1305 = "0.9"
zeroize = "1.9.1"
