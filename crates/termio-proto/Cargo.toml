[package]
name = "termio-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1.1.11"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt"] }
