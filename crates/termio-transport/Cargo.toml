[package]
name = "termio-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.3"
portable-pty = "0.9.0"
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
termio-agent = { version = "0.1.0", path = "../termio-agent" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "fs", "io-util"] }
zeroize = "1.9.1"

[dev-dependencies]
portable-pty = "0.9.0"
